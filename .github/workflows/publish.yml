name: CI & Publish

# Tests run on every push to main + PRs. Publishing happens only on a
# vX.Y.Z tag, via npm Trusted Publishing (OIDC) — no token, no OTP, no
# stored secret. One-time npm setup: package Settings → Trusted Publisher
# → GitHub Actions → this repo + this workflow filename (publish.yml).
#
# Release flow: bump version in package.json, update CHANGELOG.md, then
# `git tag vX.Y.Z && git push origin vX.Y.Z`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  publish:
    needs: [test]
    # Only publish on a version tag — normal pushes/PRs just run the matrix.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for npm Trusted Publishing
      contents: write # checkout + create the GitHub Release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      # No `registry-url` here: it writes an .npmrc with a placeholder
      # _authToken that overrides the OIDC flow (npm then publishes with
      # the bogus token and gets a 404).
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1; the npm
      # bundled with Node 22 is older.
      - run: npm install -g npm@latest

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::tag $TAG != package version $PKG"; exit 1; }

      - run: npm ci
      - run: npm run build

      - name: Publish to npm (OIDC, with provenance)
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
